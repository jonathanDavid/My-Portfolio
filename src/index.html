<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jonathan Ilias · Senior Full Stack & Cloud Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jonathan Ilias — Senior Full Stack & Cloud Engineer. 7+ years building scalable SaaS and cloud-native platforms with TypeScript, Angular, NestJS, AWS, Azure and Terraform.">
  <meta name="theme-color" content="#0b0f12">
  <meta name="author" content="Jonathan Ilias">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <!-- Set theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ji-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
