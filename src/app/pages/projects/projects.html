<section class="section">
  <div class="container">
    <p class="eyebrow" appReveal="up"><app-icon name="boxes" [size]="15" />Projects</p>
    <h1 appReveal="up"><span class="gradient-text">Things I've built</span></h1>
    <p class="lead" appReveal="up" [revealDelay]="60">
      Production systems I shipped, and honest work-in-progress I'm building to explore new corners
      of the stack. No dead links — in-progress cards say so.
    </p>

    <h2 class="group-title" appReveal="up">
      <span class="head-icon"><app-icon name="rocket" [size]="18" /></span> Shipped
    </h2>
    <app-card-carousel class="collage" [projects]="shipped" label="Shipped projects" appReveal="up" />

    <h2 class="group-title" appReveal="up">
      <span class="head-icon"><app-icon name="sparkles" [size]="18" /></span> In progress
    </h2>
    <p class="muted group-note">Active experiments — repos go public as they mature.</p>
    <app-card-carousel [projects]="inProgress" label="In-progress projects" appReveal="up" />
  </div>
</section>
