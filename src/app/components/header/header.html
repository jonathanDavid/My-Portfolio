<header class="site-header">
  <div class="container bar">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="Home">
      <span class="brand__avatar">
        <picture>
          <source srcset="assets/avatar-96.webp" type="image/webp" />
          <img src="assets/avatar-96.png" alt="Jonathan Ilias avatar" width="40" height="40" decoding="async" />
        </picture>
      </span>
      <span class="brand__name">Jonathan Ilias</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation"
      (click)="toggleMenu()"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="20" />
    </button>

    <nav class="nav" [class.nav--open]="menuOpen()" aria-label="Primary">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
        <app-icon name="cpu" [size]="16" /><span>Home</span>
      </a>
      <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">
        <app-icon name="boxes" [size]="16" /><span>Projects</span>
      </a>
      <a routerLink="/experience" routerLinkActive="active" (click)="closeMenu()">
        <app-icon name="briefcase" [size]="16" /><span>Experience</span>
      </a>

      <button
        class="theme-toggle"
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        title="Toggle theme"
      >
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>
    </nav>
  </div>
</header>
